# Site include for /etc/nginx/conf.d/yizhu.conf (not a global nginx.conf).
# Follows the existing 942295 sites: HTTPS redirect, shared certificate,
# "main" access log, static H5 root and a loopback upstream for the API.
# Build client/dist/h5 for H5; Python on 127.0.0.1:8091 is only needed by the API.
# Do not install/reload until deployment has been explicitly approved.

server {
    listen       80;
    listen       [::]:80;
    server_name  yizhu.942295.xyz yizhuh5.942295.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  yizhuh5.942295.xyz;

    ssl_certificate     /etc/nginx/ssl/942295/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/942295/key.pem;

    access_log  /var/log/nginx/yizhuh5.access.log  main;
    error_log   /var/log/nginx/yizhuh5.error.log;

    root /home/zhang/workspace/zdog-yizhu/client/dist/h5;
    index index.html;
    disable_symlinks on from=$document_root;

    # The public API belongs to yizhu.942295.xyz, not the H5 host.
    location = /api {
        return 404;
    }
    location /api/ {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }
    location ~* \.(map|pem|key|py|toml|lock)$ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Missing static files must not return the SPA HTML.
    location /assets/ {
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  yizhu.942295.xyz;

    ssl_certificate     /etc/nginx/ssl/942295/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/942295/key.pem;

    access_log  /var/log/nginx/yizhu.access.log  main;
    error_log   /var/log/nginx/yizhu.error.log;
    client_max_body_size 1m;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # No trailing slash: preserve /api/ in the upstream request.
        proxy_pass http://yizhu-backend;
    }

    # Do not serve the frontend from the API domain.
    location / {
        return 404;
    }
}

upstream yizhu-backend {
    server 127.0.0.1:8091;
}
