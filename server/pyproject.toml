[project]
name = "zdog-yizhu-server"
version = "0.1.0"
description = "Yizhu Flask API with zdog-auth authentication"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "waitress>=3.0,<4",
]

[project.scripts]
yizhu-server = "yizhu_server:main"
yizhu-recognize = "yizhu_server.recognition_cli:main"
yizhu-catalog = "yizhu_server.catalog_import:main"

[project.optional-dependencies]
recognition = [
    "pillow>=11,<13",
    "pybioclip>=2.1.6",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Keep CPU inference opt-in; never download the Linux CUDA dependency stack.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/yizhu_server"]
